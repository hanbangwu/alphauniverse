[project]
name = "alphauniverse"
version = "0.1.0"
description = "The Embedding-Based Virtual Astronomical Observatory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=5.0.1",
  "faiss-cpu>=1.15.0",
  "fastapi[standard]>=0.141.1",
  "modal>=1.5.4",
  "numpy>=2.5.2",
  "pillow>=12.3.0",
  "pyarrow>=25.0.1",
  "pydantic>=2.13.4",
  "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
]
build = [
  "polymathic-aion>=0.0.2",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "tqdm>=4.70.0",
  "umap-learn>=0.5.12",
  "wandb>=0.28.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
