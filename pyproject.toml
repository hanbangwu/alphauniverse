[project]
name = "alphauniverse"
version = "0.1.0"
description = "The Embedding-Based Virtual Astronomical Observatory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "astropy>=8.0.1",
  "datasets>=5.1.0",
  "fastapi[standard]>=0.142.2",
  "modal>=1.6.1",
  "numpy>=2.5.3",
  "pillow>=12.3.0",
  "pyarrow>=25.0.1",
  "pydantic>=2.13.5",
  "sentence-transformers[image]>=6.1.0",
  "torch>=2.14.1",
  "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "ruff>=0.16.10", "threadpoolctl>=3.7.0"]
build = [
  "polymathic-aion[torch]>=0.0.2",
  "scikit-learn>=1.9.1",
  "torchvision>=0.29.1",
  "umap-learn>=0.5.12",
  "wandb>=0.30.0",
]
dataset = ["dask[distributed]>=2026.8.0", "lsdb>=0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff.lint]
extend-select = ["FIX"]
