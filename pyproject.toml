[project]
name = "alphauniverse"
version = "0.0.1"
description = "Search engine for galaxies"
readme = "README.md"
authors = [
    { name = "Hanbang Wu", email = "hanbang.wu@mail.utoronto.ca" },
    { name = "Biprateep Dey", email = "b.dey@utoronto.ca" },
    { name = "Nolan Koblischke", email = "nolan.koblischke@mail.utoronto.ca" },
    { name = "Joshua Speagle", email = "j.speagle@utoronto.ca" },
]
requires-python = ">=3.12"
dependencies = [
    "annotated-types>=0.4.0",
    "astropy>=6.1.0",
    "datasets>=4.0.0",
    "huggingface-hub>=0.24.7",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "polymathic-aion[torch]>=0.0.2",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.4",
    "tokenizers>=0.15.2",
    "torch>=2.7.0",
]

[project.optional-dependencies]
text = ["qwen-vl-utils>=0.0.14", "sentence-transformers[image]>=6.0.0"]
build = [
    "alphauniverse[text]",
    "flash-linear-attention>=0.6.0",
    "kernels>=0.17.0,<0.18.0",
    "matplotlib>=3.9.0",
    "pyarrow>=19.0.0",
    "scikit-learn>=1.4.2",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "server" },
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "threadpoolctl>=3.7.0",
]
server = ["alphauniverse[text]", "fastapi[standard]>=0.142.2", "modal>=1.6.1"]
build = [
    { include-group = "server" },
    "alphauniverse[build]",
    "scipy>=1.18.1",
    "umap-learn>=0.5.12",
]
dataset = ["dask[distributed]>=2026.8.0", "lsdb>=0.11.0"]
docs = [
    "bokeh>=3.10.0",
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
    "sphinxcontrib-openapi>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib"
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]

[tool.importlinter]
root_packages = ["alphauniverse", "server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The server imports no build code"
type = "forbidden"
source_modules = ["server.main"]
forbidden_modules = [
    "alphauniverse.build",
    "alphauniverse.*.build",
    "server.*.build",
    "fla",
    "kernels",
    "matplotlib",
    "scipy",
    "sklearn",
    "torchvision",
    "umap",
    "wandb",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff.lint]
extend-select = ["FIX"]
