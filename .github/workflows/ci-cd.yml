name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - CLAUDE.md
      - .claude/rules/**
      - README.md
      - docs/**
  pull_request:
  workflow_dispatch:

env:
  UV_LOCKED: "1"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: |
          uv run --python 3.12 ruff check app core pipeline scripts tests
          uv run --python 3.12 ruff format --check app core pipeline scripts tests

      - name: Test
        run: uv run --python 3.12 --group build pytest

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Check web/openapi.json is current
        run: |
          uv run --python 3.12 python -m scripts.openapi
          git diff --exit-code --stat web/openapi.json || { echo "::error::web/openapi.json is stale; run 'uv run python -m scripts.openapi' and commit"; exit 1; }

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv run --python 3.12 --group docs make -C docs html

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [python, openapi, web]
    if: github.event_name == 'push'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Deploy
        run: uv tool run modal deploy -m app.modal_app

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [python, openapi, web]
    if: github.event_name == 'workflow_dispatch'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Deploy
        run: uv tool run modal deploy --env dev -m app.modal_app
