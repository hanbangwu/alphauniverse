name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: uv run --python 3.12 pytest

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Check frontend/openapi.json is current
        run: |
          uv run --python 3.12 python -m scripts.openapi
          git diff --exit-code --stat frontend/openapi.json || { echo "::error::frontend/openapi.json is stale; run 'uv run python -m scripts.openapi' and commit"; exit 1; }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [python, openapi, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gating on three jobs delays this step by however long the slowest takes,
    # so two merges close together could otherwise deploy out of order and
    # leave production on the older commit. Queue instead of cancelling: a
    # half-applied `modal deploy` is worse than a late one.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Deploy
        run: uv tool run modal deploy -m modal_app
