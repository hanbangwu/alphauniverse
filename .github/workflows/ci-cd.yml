name: CI/CD
on:
  push:
    branches: [main]
    paths-ignore: [CLAUDE.md, .claude/rules/**, README.md, docs/**]
  pull_request:
  workflow_dispatch:
env:
  UV_LOCKED: "1"
  UV_PYTHON: "3.12"
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: |
          uv run ruff check app scripts tests modal_app.py
          uv run ruff format --check app scripts tests modal_app.py
      - run: uv run --group build pytest
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: |
          uv run python -m scripts.openapi
          git diff --exit-code web/openapi.json
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --group docs make -C docs html
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
  deploy:
    runs-on: ubuntu-latest
    needs: [python, openapi, web]
    if: github.event_name == 'push'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv tool run modal deploy -m modal_app
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [python, openapi, web]
    if: github.event_name == 'workflow_dispatch'
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv tool run modal deploy --env dev -m modal_app
