name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: uv run --python 3.12 pytest

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Check frontend/openapi.json is current
        run: uv run --python 3.12 python -m scripts.openapi && git diff --exit-code --stat frontend/openapi.json \|| { echo "::error::frontend/openapi.json is stale; run 'uv run python -m scripts.openapi' and commit"; exit 1; }

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Deploy
        run: uv tool run modal deploy -m modal_app
