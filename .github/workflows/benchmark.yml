name: Benchmark
run-name: ${{ inputs.script }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      script:
        description: Measurement to run on Modal
        type: choice
        options:
          - search_quality
          - search_performance
          - backend_performance
          - projection_quality
          - text_search_quality
          - pql_quality
          - compression_quality
      args:
        description: Arguments for the script, such as --runs 50; empty keeps its defaults
        type: string

env:
  UV_LOCKED: "1"

jobs:
  measure:
    name: ${{ inputs.script }}
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
      REPORT: docs/benchmarks/${{ inputs.script }}.json

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Run on Modal
        run: uv run --python 3.12 modal run -m "scripts.benchmarks.$SCRIPT" $ARGS

      - name: Report
        run: |
          if [ "$(stat -c %s "$REPORT")" -lt 1000000 ]; then
            {
              echo '```json'
              cat "$REPORT"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The report is over the step summary's 1 MiB limit; it is in the run's artifact." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.REPORT }}
          archive: false
