name: Benchmark
run-name: ${{ inputs.script }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      script:
        type: choice
        options:
          - search_performance
          - search_quality
          - backend_performance
          - projection_quality
          - text_search_quality
          - compression_quality
          - token_embedding_quality
          - aion_prediction_quality
          - aion_prediction_embedding_quality
          - retrieval_quality
          - redshift_quality
          - probe_quality
          - neighbour_quality
      args: {}
env:
  UV_LOCKED: "1"
  UV_PYTHON: "3.12"
jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
      REPORT: docs/benchmarks/${{ inputs.script }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --group build modal run -m "scripts.benchmarks.$SCRIPT" $ARGS
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.REPORT }}
          archive: false
