name: Benchmark
run-name: ${{ inputs.script }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      script:
        type: choice
        options:
          - search.search_performance
          - search.search_quality
          - backend_performance
          - projection.build.projection_quality
          - text_search.text_search_quality
          - predictions.build.compression_quality
          - predictions.build.token_embedding_quality
          - predictions.build.aion_prediction_quality
          - predictions.build.aion_prediction_embedding_quality
          - predictions.build.retrieval_quality
          - predictions.build.redshift_quality
          - predictions.build.probe_quality
          - projection.build.neighbor_quality
      args: {}
env:
  UV_LOCKED: "1"
  UV_PYTHON: "3.12"
jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: echo "REPORT=docs/benchmarks/${SCRIPT##*.}.json" >> "$GITHUB_ENV"
      - run: uv run --group build modal run -m "benchmarks.$SCRIPT" $ARGS
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.REPORT }}
          archive: false
