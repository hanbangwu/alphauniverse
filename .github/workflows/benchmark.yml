name: Benchmark
run-name: ${{ inputs.script }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      script:
        description: Measurement to run on Modal
        type: choice
        options:
          - search_quality
          - search_performance
          - backend_performance
      runs:
        description: The performance scripts' --runs; empty keeps its default
        type: string
      per_kind:
        description: search_quality's --per-kind; empty keeps its default
        type: string

env:
  UV_LOCKED: "1"

jobs:
  measure:
    name: ${{ inputs.script }}
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SCRIPT: ${{ inputs.script }}
      RUNS: ${{ inputs.runs }}
      PER_KIND: ${{ inputs.per_kind }}
      REPORT: docs/benchmarks/${{ inputs.script }}.json

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Run on Modal
        run: |
          case "$SCRIPT" in
            search_quality) set -- ${PER_KIND:+--per-kind "$PER_KIND"} ;;
            *) set -- ${RUNS:+--runs "$RUNS"} ;;
          esac
          uv run --python 3.12 modal run -m "scripts.benchmarks.$SCRIPT" "$@"

      - name: Report
        run: |
          {
            echo '```json'
            cat "$REPORT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.REPORT }}
          archive: false
