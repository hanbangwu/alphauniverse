name: Rules

on:
  pull_request:

jobs:
  rules:
    name: Rules
    runs-on: ubuntu-latest
    env:
      COMMITS: HEAD^1..HEAD^2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: No commits authored by an agent or bot
        run: |
          violations=$(git log --extended-regexp --regexp-ignore-case --author='<(noreply@anthropic\.com|.*\[bot\]@users\.noreply\.github\.com|.*\+copilot@users\.noreply\.github\.com)>' --format='%h %an <%ae>' "$COMMITS")
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Commits authored by an agent or bot; CLAUDE.md requires a human author"
            exit 1
          fi

      - name: No commits by Claude without its Co-Authored-By trailer
        run: |
          violations=$(git log --regexp-ignore-case --committer='<noreply@anthropic\.com>' --invert-grep --grep='^Co-Authored-By: .*<noreply@anthropic\.com>' --format='%h %s' "$COMMITS")
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Commits committed by Claude without a Co-Authored-By trailer naming noreply@anthropic.com"
            exit 1
          fi
