name: Rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  rules:
    name: Rules
    runs-on: ubuntu-latest
    env:
      EM_DASH: "\u2014"
      COMMITS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: No em dashes in tracked files
        run: |
          if git grep -nIF "$EM_DASH"; then
            echo "::error::Tracked files contain em dashes"
            exit 1
          fi

      - name: No em dashes in commit messages
        run: |
          if git log -F --grep "$EM_DASH" --format='%h %s' "$COMMITS" | grep .; then
            echo "::error::Commit messages contain em dashes"
            exit 1
          fi

      - name: No em dashes in the title or body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$TITLE" "$BODY" | grep -nF "$EM_DASH"; then
            echo "::error::The pull request's title or body contains em dashes"
            exit 1
          fi
