<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" role="img" aria-labelledby="text-search-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="text-search-title">EmbeddingGemma embeds each galaxy's colour image, its spectrum plot and the text query in one space, and every galaxy's image and spectrum rows are ranked together by cosine to the query.</title>
  <defs>
    <marker id="text-search-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="10" y="64">colour image</text>
    <text x="10" y="134">spectrum plot</text>
    <text x="10" y="214">"a quiescent galaxy"</text>
  </g>
  <g marker-end="url(#text-search-arrow)">
    <line x1="140" y1="60" x2="250" y2="60"/>
    <line x1="140" y1="130" x2="250" y2="130"/>
    <line x1="140" y1="210" x2="250" y2="210"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="195" y="53">EmbeddingGemma</text>
    <text x="195" y="123">EmbeddingGemma</text>
    <text x="195" y="203">EmbeddingGemma</text>
  </g>
  <circle cx="430" cy="135" r="105" stroke-dasharray="4 3"/>
  <text x="430" y="20" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">EmbeddingGemma space</text>
  <g fill="currentColor" stroke="none">
    <circle cx="398" cy="90" r="5"/>
    <rect x="404" y="130" width="10" height="10"/>
    <circle cx="470" cy="185" r="5" fill-opacity="0.4"/>
  </g>
  <g stroke-dasharray="2 3">
    <line x1="255" y1="60" x2="392" y2="89"/>
    <line x1="255" y1="130" x2="403" y2="135"/>
    <line x1="255" y1="210" x2="464" y2="187"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="555" y="90">image row</text>
    <text x="555" y="138">spectrum row</text>
    <text x="555" y="180">query: every row ranked</text>
    <text x="555" y="194">by cosine, together</text>
  </g>
</svg>
