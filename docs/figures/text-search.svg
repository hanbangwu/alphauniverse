<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" role="img" aria-labelledby="text-search-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="text-search-title">EmbeddingGemma embeds each galaxy's colour image and the text query in one space; a network trained to land AION's mean embedding on the image's point carries every galaxy into that space, where galaxies are ranked by cosine to the query.</title>
  <defs>
    <marker id="text-search-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="20" y="45">colour image</text>
    <text x="20" y="105">AION mean embedding</text>
    <text x="20" y="165">"a quiescent galaxy"</text>
  </g>
  <line x1="150" y1="41" x2="250" y2="41" marker-end="url(#text-search-arrow)"/>
  <line x1="150" y1="101" x2="250" y2="101" marker-end="url(#text-search-arrow)"/>
  <line x1="150" y1="161" x2="250" y2="161" marker-end="url(#text-search-arrow)"/>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="200" y="34">EmbeddingGemma</text>
    <text x="200" y="94">network f</text>
    <text x="200" y="154">EmbeddingGemma</text>
  </g>
  <circle cx="420" cy="100" r="85" stroke-dasharray="4 3"/>
  <text x="420" y="30" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">EmbeddingGemma space</text>
  <g fill="currentColor" stroke="none">
    <circle cx="380" cy="75" r="5" fill-opacity="0.4"/>
    <circle cx="388" cy="80" r="5"/>
    <circle cx="455" cy="125" r="5"/>
  </g>
  <line x1="255" y1="41" x2="372" y2="72" stroke-dasharray="2 3"/>
  <line x1="255" y1="101" x2="380" y2="80" stroke-dasharray="2 3"/>
  <line x1="255" y1="161" x2="448" y2="127" stroke-dasharray="2 3"/>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="525" y="70">e_g and f(a_g):</text>
    <text x="525" y="84">trained to coincide</text>
    <text x="525" y="125">t: ranked by cos(f(a_g), t)</text>
  </g>
</svg>
