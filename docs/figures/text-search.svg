<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="text-search-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="text-search-title">A network predicts, from a galaxy's AION embedding, one point in EmbeddingGemma's space for each of 26 view types, among them its images, spectrum plots and catalogue text. EmbeddingGemma embeds the text query in the same space, and the galaxy's score is the query's mean dot product with the predictions, every view type weighted alike.</title>
  <defs>
    <marker id="text-search-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="10" y="84">AION embedding</text>
    <text x="10" y="98">of galaxy g</text>
    <text x="10" y="244">"a quiescent galaxy"</text>
  </g>
  <g marker-end="url(#text-search-arrow)">
    <line x1="110" y1="90" x2="160" y2="90"/>
    <line x1="230" y1="90" x2="300" y2="110"/>
    <line x1="140" y1="240" x2="250" y2="240"/>
    <line x1="270" y1="240" x2="395" y2="207"/>
  </g>
  <rect x="160" y="72" width="70" height="36" rx="6"/>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="195" y="94">network</text>
    <text x="195" y="233">EmbeddingGemma</text>
  </g>
  <circle cx="420" cy="150" r="118" stroke-dasharray="4 3"/>
  <text x="420" y="22" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">EmbeddingGemma space</text>
  <g fill="currentColor" stroke="none">
    <circle cx="364" cy="108" r="5"/>
    <rect x="410" y="92" width="10" height="10"/>
    <path d="M466 140 l6 -11 l6 11 z"/>
    <circle cx="402" cy="202" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>
  <g stroke-dasharray="2 3">
    <line x1="402" y1="196" x2="366" y2="114"/>
    <line x1="402" y1="196" x2="414" y2="103"/>
    <line x1="402" y1="196" x2="471" y2="141"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="548" y="70">g's predictions: one</text>
    <text x="548" y="84">per view type</text>
    <text x="548" y="98">(images, plots, catalogues)</text>
    <text x="548" y="196">query t: g's score is</text>
    <text x="548" y="210">its mean dot product</text>
    <text x="548" y="224">with the predictions</text>
  </g>
</svg>
