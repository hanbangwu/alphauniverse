<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="text-search-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="text-search-title">EmbeddingGemma embeds each galaxy's colour image, its spectrum plot and the text query in one space; one network carries AION's mean image embedding onto the image's point, another carries AION's mean spectrum embedding onto the plot's point, and every galaxy's rows from both are ranked together by cosine to the query.</title>
  <defs>
    <marker id="text-search-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="10" y="44">colour image</text>
    <text x="10" y="94">AION mean image</text>
    <text x="10" y="144">spectrum plot</text>
    <text x="10" y="194">AION mean spectrum</text>
    <text x="10" y="264">"a quiescent galaxy"</text>
  </g>
  <g marker-end="url(#text-search-arrow)">
    <line x1="140" y1="40" x2="250" y2="40"/>
    <line x1="140" y1="90" x2="250" y2="90"/>
    <line x1="140" y1="140" x2="250" y2="140"/>
    <line x1="140" y1="190" x2="250" y2="190"/>
    <line x1="140" y1="260" x2="250" y2="260"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="195" y="33">EmbeddingGemma</text>
    <text x="195" y="83">network f_image</text>
    <text x="195" y="133">EmbeddingGemma</text>
    <text x="195" y="183">network f_spectrum</text>
    <text x="195" y="253">EmbeddingGemma</text>
  </g>
  <circle cx="430" cy="150" r="115" stroke-dasharray="4 3"/>
  <text x="430" y="25" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">EmbeddingGemma space</text>
  <g fill="currentColor" stroke="none">
    <circle cx="390" cy="95" r="5" fill-opacity="0.4"/>
    <circle cx="398" cy="100" r="5"/>
    <rect x="401" y="157" width="10" height="10" fill-opacity="0.4"/>
    <rect x="409" y="162" width="10" height="10"/>
    <circle cx="470" cy="215" r="5"/>
  </g>
  <g stroke-dasharray="2 3">
    <line x1="255" y1="40" x2="383" y2="92"/>
    <line x1="255" y1="90" x2="392" y2="100"/>
    <line x1="255" y1="140" x2="401" y2="160"/>
    <line x1="255" y1="190" x2="409" y2="168"/>
    <line x1="255" y1="260" x2="464" y2="217"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="555" y="92">image targets and rows:</text>
    <text x="555" y="106">trained to coincide</text>
    <text x="555" y="160">spectrum targets and rows:</text>
    <text x="555" y="174">trained to coincide</text>
    <text x="555" y="214">query: every row ranked</text>
    <text x="555" y="228">by cosine, together</text>
  </g>
</svg>
