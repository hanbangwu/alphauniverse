<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" role="img" aria-labelledby="map-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="map-title">Embeddings that are near neighbours in 768 dimensions are joined by weighted links; a small network places each embedding on the map so that linked embeddings land close together.</title>
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="130" y="20" font-weight="bold">768 dimensions: neighbour links</text>
    <text x="350" y="20" font-weight="bold">network</text>
    <text x="570" y="20" font-weight="bold">the map: 2 dimensions</text>
  </g>
  <g stroke-opacity="0.6">
    <line x1="60" y1="70" x2="95" y2="55"/><line x1="95" y1="55" x2="110" y2="90"/><line x1="60" y1="70" x2="110" y2="90"/>
    <line x1="160" y1="130" x2="195" y2="150"/><line x1="195" y1="150" x2="170" y2="170"/><line x1="160" y1="130" x2="170" y2="170"/>
    <line x1="110" y1="90" x2="160" y2="130" stroke-dasharray="3 3"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="60" cy="70" r="5"/><circle cx="95" cy="55" r="5"/><circle cx="110" cy="90" r="5"/>
    <circle cx="160" cy="130" r="5" fill-opacity="0.5"/><circle cx="195" cy="150" r="5" fill-opacity="0.5"/><circle cx="170" cy="170" r="5" fill-opacity="0.5"/>
  </g>
  <line x1="240" y1="110" x2="295" y2="110" marker-end="url(#map-arrow)"/>
  <rect x="300" y="80" width="100" height="60" rx="4"/>
  <text x="350" y="106" fill="currentColor" stroke="none" text-anchor="middle">768 → 256</text>
  <text x="350" y="122" fill="currentColor" stroke="none" text-anchor="middle">→ 128 → 2</text>
  <line x1="405" y1="110" x2="460" y2="110" marker-end="url(#map-arrow)"/>
  <rect x="480" y="40" width="180" height="140"/>
  <g fill="currentColor" stroke="none">
    <circle cx="520" cy="80" r="5"/><circle cx="535" cy="72" r="5"/><circle cx="532" cy="92" r="5"/>
    <circle cx="610" cy="140" r="5" fill-opacity="0.5"/><circle cx="625" cy="150" r="5" fill-opacity="0.5"/><circle cx="612" cy="158" r="5" fill-opacity="0.5"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11">
    <text x="130" y="195">solid: strong links; dashed: weak</text>
    <text x="570" y="195">axes have no units</text>
  </g>
</svg>
