<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" role="img" aria-labelledby="query-maps-title" font-family="sans-serif" font-size="12" fill="none" stroke="currentColor">
  <title id="query-maps-title">For one slot c, each galaxy contributes a point: its agreement with the query at c against its score on the selection. The partial correlation of these points, after removing overall resemblance, shades slot c on the query's panel.</title>
  <defs>
    <marker id="query-maps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="140" y="20" font-weight="bold">every galaxy, at slot c</text>
    <text x="360" y="20" font-weight="bold">remove overall resemblance</text>
    <text x="590" y="20" font-weight="bold">shade slot c</text>
  </g>
  <line x1="60" y1="170" x2="230" y2="170"/><line x1="60" y1="170" x2="60" y2="40"/>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="145" y="190" text-anchor="middle">agreement at c, A_c(g)</text>
    <text x="48" y="105" text-anchor="middle" transform="rotate(-90 48 105)">selection score S(g)</text>
  </g>
  <g fill="currentColor" fill-opacity="0.5" stroke="none">
    <circle cx="80" cy="150" r="3"/><circle cx="95" cy="140" r="3"/><circle cx="105" cy="148" r="3"/><circle cx="120" cy="125" r="3"/><circle cx="130" cy="118" r="3"/>
    <circle cx="140" cy="128" r="3"/><circle cx="155" cy="100" r="3"/><circle cx="165" cy="95" r="3"/><circle cx="180" cy="80" r="3"/><circle cx="195" cy="72" r="3"/>
    <circle cx="205" cy="60" r="3"/><circle cx="110" cy="132" r="3"/><circle cx="150" cy="110" r="3"/><circle cx="185" cy="90" r="3"/>
  </g>
  <line x1="245" y1="105" x2="285" y2="105" marker-end="url(#query-maps-arrow)"/>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11">
    <text x="360" y="90">partial correlation ρ_c</text>
    <text x="360" y="108">controlling for C(g),</text>
    <text x="360" y="124">agreement outside the selection</text>
  </g>
  <line x1="440" y1="105" x2="480" y2="105" marker-end="url(#query-maps-arrow)"/>
  <rect x="510" y="45" width="120" height="120"/>
  <g fill="currentColor" stroke="none">
    <rect x="550" y="85" width="20" height="20" fill-opacity="0.8"/>
    <rect x="570" y="85" width="20" height="20" fill-opacity="0.4"/>
    <rect x="550" y="105" width="20" height="20" fill-opacity="0.4"/>
    <rect x="530" y="65" width="20" height="20" fill-opacity="0.15"/>
  </g>
  <text x="570" y="183" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">darker: higher ρ_c</text>
</svg>
