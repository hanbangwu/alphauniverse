<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" role="img" aria-labelledby="aion-pipeline-title" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor">
  <title id="aion-pipeline-title">A galaxy's observations become tokens; AION's encoder turns the tokens into embeddings, and its decoder predicts a distribution over codes at every slot.</title>
  <defs>
    <marker id="aion-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="70" y="22" font-weight="bold">Observations</text>
    <text x="250" y="22" font-weight="bold">Tokens</text>
    <text x="440" y="22" font-weight="bold">Embeddings</text>
    <text x="650" y="22" font-weight="bold">Predictions</text>
  </g>
  <rect x="35" y="40" width="70" height="50" rx="3"/>
  <circle cx="70" cy="65" r="12" stroke-dasharray="3 2"/>
  <text x="70" y="104" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">image</text>
  <path d="M30 150 l10 -8 l8 5 l8 -20 l8 25 l10 -6 l12 3 l10 -4"/>
  <text x="70" y="168" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">spectrum</text>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11">
    <text x="70" y="200">mag, flux, z …</text>
    <text x="70" y="216">catalogue</text>
  </g>
  <line x1="120" y1="125" x2="178" y2="125" marker-end="url(#aion-pipeline-arrow)"/>
  <text x="149" y="116" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">codecs</text>
  <g font-size="11">
    <rect x="190" y="45" width="120" height="22" rx="2"/>
    <text x="250" y="60" fill="currentColor" stroke="none" text-anchor="middle">1832 · 77 · 4021 …</text>
    <rect x="190" y="114" width="120" height="22" rx="2"/>
    <text x="250" y="129" fill="currentColor" stroke="none" text-anchor="middle">512 · 9 · 640 …</text>
    <rect x="190" y="183" width="120" height="22" rx="2"/>
    <text x="250" y="198" fill="currentColor" stroke="none" text-anchor="middle">301 · 88 · 1003</text>
    <text x="250" y="225" fill="currentColor" stroke="none" text-anchor="middle">one integer per slot</text>
  </g>
  <line x1="320" y1="125" x2="378" y2="125" marker-end="url(#aion-pipeline-arrow)"/>
  <text x="349" y="116" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">encoder</text>
  <g fill="currentColor" fill-opacity="0.25">
    <rect x="392" y="45" width="10" height="160"/>
    <rect x="408" y="45" width="10" height="160"/>
    <rect x="424" y="45" width="10" height="160"/>
    <rect x="440" y="45" width="10" height="160"/>
    <rect x="456" y="45" width="10" height="160"/>
    <rect x="472" y="45" width="10" height="160"/>
  </g>
  <text x="440" y="225" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">768 numbers per token</text>
  <line x1="495" y1="125" x2="553" y2="125" marker-end="url(#aion-pipeline-arrow)"/>
  <text x="524" y="116" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">decoder</text>
  <g fill="currentColor" fill-opacity="0.25">
    <rect x="570" y="80" width="8" height="10"/>
    <rect x="580" y="50" width="8" height="40"/>
    <rect x="590" y="70" width="8" height="20"/>
    <rect x="600" y="85" width="8" height="5"/>
    <rect x="610" y="87" width="8" height="3"/>
    <rect x="570" y="190" width="8" height="15"/>
    <rect x="580" y="198" width="8" height="7"/>
    <rect x="590" y="160" width="8" height="45"/>
    <rect x="600" y="180" width="8" height="25"/>
    <rect x="610" y="200" width="8" height="5"/>
  </g>
  <line x1="566" y1="90" x2="622" y2="90"/>
  <line x1="566" y1="205" x2="622" y2="205"/>
  <g fill="currentColor" stroke="none" text-anchor="start" font-size="11">
    <text x="632" y="75">slot 1: probability</text>
    <text x="632" y="89">of each code</text>
    <text x="632" y="190">slot 1,722</text>
    <text x="596" y="140" text-anchor="middle">⋮</text>
  </g>
</svg>
